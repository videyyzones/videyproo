<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vudol</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --btn:#111827; --btnText:#ffffff; --btnHover:#000000; --card:#f8fafc;
}

*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100% }
html,body{ height:100%; margin:0 }
body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
  color:var(--text); background:var(--bg); line-height:1.45;
  overflow-x:hidden;
}

.appbar{
  position:sticky; top:0; z-index:20; background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line);
}
.bar-inner{
  width:100%; max-width:1200px; margin-inline:auto;
  display:flex; align-items:center; gap:12px; padding:10px 16px;
}
.brand{ display:flex; align-items:center; gap:8px; font-weight:800 }
.logo{ width:28px; height:28px; display:grid; place-items:center; background:#111827; color:#fff; border-radius:6px }
.spacer{ flex:1 }
.btn{ border:0; padding:10px 14px; border-radius:12px; background:var(--btn); color:var(--btnText); font-weight:600 }

.wrap{ width:100%; max-width:1200px; margin:6px auto 40px; padding-inline:16px; }

.phone{
  width:clamp(240px, 92vw, 420px);
  aspect-ratio:9/16;
  border-radius:22px;
  overflow:hidden;
  background:#000;
  margin:auto;
}

.phone video{ width:100%; height:100%; object-fit:cover }

.meta{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:10px;
}
</style>
</head>

<body>

<header class="appbar">
  <div class="bar-inner">
    <div class="brand">
      <span class="logo">V</span>
      <span>vldey<span style="color:#3b82f6">.co</span></span>
    </div>
    <div class="spacer"></div>
    <button class="btn">Upload</button>
  </div>
</header>

<main class="wrap">

  <div class="phone">
    <video id="video" playsinline controls>
      <source src="https://cdn2.videy.co/5Ln0fkF91.mp4" type="video/mp4">
    </video>
  </div>

  <div class="meta">0:00 / 3:57 • Putar untuk memulai</div>

</main>

<script>
const v = document.getElementById('video');
const meta = document.querySelector('.meta');

function fmt(t){
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

v.addEventListener('loadedmetadata', ()=>{
  meta.textContent = `0:00 / ${fmt(v.duration)}`;
});

v.addEventListener('timeupdate', ()=>{
  meta.textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`;
});
</script>

</html>
